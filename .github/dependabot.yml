version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      maintenance:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: vue
        update-types: [version-update:semver-major]
      - dependency-name: vue-router
        update-types: [version-update:semver-major]
      - dependency-name: vuetify
        update-types: [version-update:semver-major]
      - dependency-name: "@vue/*"
        update-types: [version-update:semver-major]
